name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    # Pinned so a runner image upgrade is a deliberate change, not a surprise.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Testcontainers starts Postgres, Redis and RabbitMQ using the runner's Docker daemon.
      - run: pnpm test:int

      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    needs: verify
    # Pinned so a runner image upgrade is a deliberate change, not a surprise.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start infrastructure
        run: |
          cp .env.example .env
          docker compose up -d --wait

      - run: pnpm db:deploy

      - run: pnpm build

      - run: pnpm --filter @pointshub/web exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
